name: Build and publish stylebot.zip

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  chrome-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Chrome extension
        run: yarn build

      - name: Create zip of Chrome extension
        run: |
          cd dist
          zip -r ../stylebot.zip .
          cd ..

      - name: Commit stylebot.zip to build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # create or reset build branch from current commit
          git checkout -B build
          git add -f stylebot.zip
          git commit -m "chore(build): add stylebot.zip" || echo "No changes to commit"
          git push --force origin build

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stylebot-chrome
          path: dist